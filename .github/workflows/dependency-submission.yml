name: Dependency submission
# GitHub cannot read Android's Gradle dependencies from the build files, so without this Dependabot has no alerts
# for them. It builds with the public stub: the private core adds no dependencies and must not reach this job.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      # Only to submit the dependency list.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use the basic stub core
        run: scripts/use-core-stub.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # v3 defaults to "tools platform-tools"; the obsolete "tools" package makes newer sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          build-root-directory: android
