name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# The job only reads the repository; keep the automatic GITHUB_TOKEN read-only.
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HAS_CORE: ${{ secrets.CORE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tuned grading is a private submodule. Fork PRs get no secrets and build with the basic stub.
      - name: Fetch the private grading core
        if: env.HAS_CORE == 'true'
        env:
          CORE_DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/core_key"
          printf '%s\n' "$CORE_DEPLOY_KEY" > "$RUNNER_TEMP/core_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/core_key -o IdentitiesOnly=yes" git submodule update --init --depth 1 core
          rm "$RUNNER_TEMP/core_key"
      - name: Use the basic stub core
        if: env.HAS_CORE != 'true'
        run: scripts/use-core-stub.sh
      # Logs of a public repository are public, and compilers echo source lines under their warnings. `shell: bash`
      # adds pipefail, so a failure still fails the step through the filter.
      - name: Core tests (grading, recommendations, export sizing)
        shell: bash
        run: swift test 2>&1 | ../scripts/hide-core-source.sh
        working-directory: ios
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.HAS_CORE == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Native rendering checks
        if: env.HAS_CORE == 'true'
        shell: bash
        run: core/tools/parity/test.sh --allow-no-gpu 2>&1 | scripts/hide-core-source.sh
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: ios
      - name: App and core tests on an iPhone simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime in devices.values() for device in runtime
                     if device.get("isAvailable") and device["name"].startswith("iPhone")))
          ')"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          # Exercise the system picker with real public fixtures, shared with Android's device tests.
          xcrun simctl addmedia "$simulator_id" \
            ../android/app/src/androidTest/assets/audit-exif.jpg \
            ../android/app/src/androidTest/assets/audit-video.mp4
          xcodebuild test -project AquaRestore.xcodeproj -scheme AquaRestore -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath build \
            -parallel-testing-enabled NO -resultBundlePath build/AppTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 \
            | ../scripts/hide-core-source.sh
        working-directory: ios
      # Artifacts of a public repository are public, and this bundle holds the build logs of the private core.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.HAS_CORE != 'true'
        with:
          name: ios-test-results
          path: ios/build/AppTests.xcresult
          if-no-files-found: ignore

  compile-stub:
    name: Compile app and tests with public core
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the basic stub core
        run: scripts/use-core-stub.sh
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: ios
      - name: Compile the app and test bundles
        run: |
          xcodebuild build-for-testing -project AquaRestore.xcodeproj -scheme AquaRestore \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/stub CODE_SIGNING_ALLOWED=NO
        working-directory: ios
