name: Android
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/CODEOWNERS', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/CODEOWNERS', '.github/dependabot.yml']
  # Emulator and simulator tests skip pushes to main (the pull request ran them), so check main once a night.
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
# A new push to a pull request replaces its older run, so outdated runs do not hold up the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The job only reads the repository; keep the automatic GITHUB_TOKEN read-only.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CORE: ${{ secrets.CORE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tuned grading is a private submodule. Fork PRs get no secrets and build with the basic stub.
      - name: Fetch the private grading core
        if: env.HAS_CORE == 'true'
        env:
          CORE_DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/core_key"
          printf '%s\n' "$CORE_DEPLOY_KEY" > "$RUNNER_TEMP/core_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/core_key -o IdentitiesOnly=yes" git submodule update --init --depth 1 core
          rm "$RUNNER_TEMP/core_key"
      - name: Use the basic stub core
        if: env.HAS_CORE != 'true'
        run: scripts/use-core-stub.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # v3 defaults to "tools platform-tools"; the obsolete "tools" package makes newer sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      # Artifacts of a public repository are public, so anything built with the private core stays on the runner.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_CORE != 'true'
        with:
          name: AquaRestore-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  # Shader, export and UI tests need a real Android system, so they run on an emulator.
  device-tests:
    name: Device tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CORE: ${{ secrets.CORE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the private grading core
        if: env.HAS_CORE == 'true'
        env:
          CORE_DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/core_key"
          printf '%s\n' "$CORE_DEPLOY_KEY" > "$RUNNER_TEMP/core_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/core_key -o IdentitiesOnly=yes" git submodule update --init --depth 1 core
          rm "$RUNNER_TEMP/core_key"
      - name: Use the basic stub core
        if: env.HAS_CORE != 'true'
        run: scripts/use-core-stub.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Hardware acceleration; without it the emulator is too slow to boot within the timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A common phone screen; without a profile the emulator gets a small default one.
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # Emulators on shared runners sometimes fail a test by chance, so a failure gets one more try. The warning
          # keeps that visible: a test that keeps needing it should be fixed.
          script: ./gradlew --console=plain :app:connectedDebugAndroidTest || (echo "::warning::Device tests failed once; retrying" && ./gradlew --console=plain :app:connectedDebugAndroidTest)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && env.HAS_CORE != 'true'
        with:
          name: device-test-report
          path: android/app/build/reports/androidTests/
