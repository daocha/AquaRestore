name: CodeQL
# Advanced setup instead of default setup: the Java/Kotlin build needs core/ filled, which default setup cannot do.
# It always uses the public stub, never the private core: CodeQL results carry file paths and code snippets, and
# the tuned core must not reach this public repository's code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none, os: ubuntu-latest }
          - { language: python, build-mode: none, os: ubuntu-latest }
          - { language: java-kotlin, build-mode: manual, os: ubuntu-latest }
          - { language: swift, build-mode: autobuild, os: macos-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use the basic stub core
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        run: scripts/use-core-stub.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.language == 'java-kotlin'
        with:
          # v3 defaults to "tools platform-tools"; the obsolete "tools" package makes newer sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # CodeQL only sees what is compiled during this step: no daemon or build cache, so every source is compiled.
      - name: Build the app
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache --console=plain :app:assembleDebug :app:compileDebugUnitTestKotlin
        working-directory: android
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
